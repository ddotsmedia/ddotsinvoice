name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ddotsinvoice_test
          POSTGRES_USER: ddots
          POSTGRES_PASSWORD: ddots
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck
      - name: Migrations on a fresh database
        run: pnpm --filter @ddotsinvoice/db db:migrate
        env:
          DATABASE_URL: postgresql://ddots:ddots@localhost:5432/ddotsinvoice_test
          DATABASE_ADMIN_URL: postgresql://ddots:ddots@localhost:5432/ddotsinvoice_test
      - name: Dependency audit (critical)
        run: pnpm audit --audit-level=critical

  build-docker:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/ddotsmedia/ddotsinvoice-api:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://ddinvoice.com/api
          tags: ghcr.io/ddotsmedia/ddotsinvoice-web:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/super-admin/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://ddinvoice.com/api
          tags: ghcr.io/ddotsmedia/ddotsinvoice-super-admin:latest
      - name: Clean up build cache
        run: docker builder prune -f || true

  deploy:
    needs: build-docker
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Only touches /opt/ddotsinvoice. Never prune images/containers host-wide:
    # the VPS runs 30+ other projects.
    env:
      APP_DIR: /opt/ddotsinvoice
    steps:
      - uses: actions/checkout@v4
      - name: Copy production compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx-ddotsinvoice.conf"
          target: ${{ env.APP_DIR }}
          overwrite: true
          strip_components: 1
      - name: Install nginx config (idempotent)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR
          script: |
            set -e
            NGINX_CONF=/etc/nginx/sites-available/ddotsinvoice
            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            # Write config only if it has changed
            if ! diff -q "$APP_DIR/nginx-ddotsinvoice.conf" "$NGINX_CONF" >/dev/null 2>&1; then
              cp "$APP_DIR/nginx-ddotsinvoice.conf" "$NGINX_CONF"
              ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/ddotsinvoice
              nginx -t
              systemctl reload nginx
              echo "nginx config updated and reloaded"
            else
              echo "nginx config unchanged, skipping reload"
            fi
      - name: Inject missing env vars from GitHub Secrets
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DDOTSINVOICE_DATABASE_ADMIN_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR,DATABASE_ADMIN_URL
          script: |
            set -e
            ENV_FILE="$APP_DIR/.env"
            test -f "$ENV_FILE" || touch "$ENV_FILE"
            # Inject DATABASE_ADMIN_URL only if the secret is set and not already in .env
            if [ -n "$DATABASE_ADMIN_URL" ]; then
              if grep -q '^DATABASE_ADMIN_URL=' "$ENV_FILE"; then
                sed -i "s|^DATABASE_ADMIN_URL=.*|DATABASE_ADMIN_URL=$DATABASE_ADMIN_URL|" "$ENV_FILE"
              else
                echo "DATABASE_ADMIN_URL=$DATABASE_ADMIN_URL" >> "$ENV_FILE"
              fi
              echo "DATABASE_ADMIN_URL injected into .env"
            else
              echo "DDOTSINVOICE_DATABASE_ADMIN_URL secret not set — skipping (login works via platform_admin_bypass RLS policy)"
            fi

      - name: Pull and restart ddotsinvoice containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd "$APP_DIR"
            test -f .env || { echo "Missing $APP_DIR/.env"; exit 1; }

            # --- Port pre-flight: show what's using our ports ---
            echo "=== Port status before deploy ==="
            for PORT in 4300 4301 4302; do
              USERS=$(ss -tlnp "sport = :$PORT" 2>/dev/null | grep LISTEN || true)
              if [ -n "$USERS" ]; then
                DOCKER_CTR=$(docker ps --filter "label=com.docker.compose.project=ddotsinvoice" --format "{{.Names}}" 2>/dev/null | head -1 || true)
                if [ -n "$DOCKER_CTR" ]; then
                  echo "  $PORT → ddotsinvoice container '$DOCKER_CTR' (will stop)"
                else
                  echo "  $PORT → IN USE by another process:"
                  echo "$USERS"
                  echo "ERROR: Port $PORT is taken by a non-ddotsinvoice process. Aborting deploy."
                  exit 1
                fi
              else
                echo "  $PORT → free"
              fi
            done

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -p ddotsinvoice -f docker-compose.prod.yml pull
            docker compose -p ddotsinvoice -f docker-compose.prod.yml down --remove-orphans

            # --- Verify ports are free after down ---
            for PORT in 4300 4301 4302; do
              if ss -tlnp "sport = :$PORT" 2>/dev/null | grep -q LISTEN; then
                echo "ERROR: Port $PORT still in use after stopping containers. Manual investigation needed."
                exit 1
              fi
            done

            docker compose -p ddotsinvoice -f docker-compose.prod.yml up -d
            docker compose -p ddotsinvoice -f docker-compose.prod.yml ps

      - name: Clean up old ddotsinvoice images on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Remove old ddotsinvoice images only (keep latest 2) — never touches other projects
            docker images ghcr.io/ddotsmedia/ddotsinvoice* --format "{{.ID}} {{.CreatedAt}}" \
              | sort -k2 -r \
              | tail -n +3 \
              | awk '{print $1}' \
              | xargs -r docker rmi --force || true

            # Remove dangling images (untagged layers from builds)
            docker image prune -f || true

            echo "ddotsinvoice image cleanup complete"
