name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ddotsinvoice_test
          POSTGRES_USER: ddots
          POSTGRES_PASSWORD: ddots
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck
      - name: Migrations on a fresh database
        run: pnpm --filter @ddotsinvoice/db db:migrate
        env:
          DATABASE_URL: postgresql://ddots:ddots@localhost:5432/ddotsinvoice_test
          DATABASE_ADMIN_URL: postgresql://ddots:ddots@localhost:5432/ddotsinvoice_test
      - name: Dependency audit (critical)
        run: pnpm audit --audit-level=critical

  build-docker:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/ddotsmedia/ddotsinvoice-api:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://ddotsinvoice.com/api
          tags: ghcr.io/ddotsmedia/ddotsinvoice-web:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/super-admin/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://ddotsinvoice.com/api
          tags: ghcr.io/ddotsmedia/ddotsinvoice-super-admin:latest

  deploy:
    needs: build-docker
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Only touches /opt/ddotsinvoice. Never prune images/containers host-wide:
    # the VPS runs 30+ other projects.
    env:
      APP_DIR: /opt/ddotsinvoice
    steps:
      - uses: actions/checkout@v4
      - name: Copy production compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ env.APP_DIR }}
          overwrite: true
      - name: Pull and restart ddotsinvoice containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd "$APP_DIR"
            test -f .env || { echo "Missing $APP_DIR/.env"; exit 1; }

            # --- Port pre-flight: show what's using our ports ---
            echo "=== Port status before deploy ==="
            for PORT in 4300 4301 4302; do
              USERS=$(ss -tlnp "sport = :$PORT" 2>/dev/null | grep -v Netid || true)
              if [ -n "$USERS" ]; then
                DOCKER_CTR=$(docker ps --filter "publish=127.0.0.1::$PORT" --format "{{.Names}}" 2>/dev/null || true)
                if [ -n "$DOCKER_CTR" ]; then
                  echo "  $PORT → ddotsinvoice container '$DOCKER_CTR' (will stop)"
                else
                  echo "  $PORT → IN USE by another process:"
                  echo "$USERS"
                  echo "ERROR: Port $PORT is taken by a non-ddotsinvoice process. Aborting deploy."
                  exit 1
                fi
              else
                echo "  $PORT → free"
              fi
            done

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -p ddotsinvoice -f docker-compose.prod.yml pull
            docker compose -p ddotsinvoice -f docker-compose.prod.yml down --remove-orphans

            # --- Verify ports are free after down ---
            for PORT in 4300 4301 4302; do
              if ss -tlnp "sport = :$PORT" 2>/dev/null | grep -q LISTEN; then
                echo "ERROR: Port $PORT still in use after stopping containers. Manual investigation needed."
                exit 1
              fi
            done

            docker compose -p ddotsinvoice -f docker-compose.prod.yml up -d
            docker compose -p ddotsinvoice -f docker-compose.prod.yml ps
