name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps import shared packages via dist/, so build them first
      - run: pnpm --filter "./packages/*" build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
