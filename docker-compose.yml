services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ddotsinvoice
      POSTGRES_USER: ddots
      POSTGRES_PASSWORD: ddots_dev
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddots -d ddotsinvoice"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["3001:3001"]
    env_file: .env
    environment:
      # inside the compose network, service names replace localhost
      DATABASE_URL: postgres://ddots_app:AppPass2026!@postgres:5432/ddotsinvoice
      DATABASE_ADMIN_URL: postgres://ddots:ddots_dev@postgres:5432/ddotsinvoice
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports: ["3000:3000"]
    depends_on: [api]

  super-admin:
    build:
      context: .
      dockerfile: apps/super-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "4200:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    depends_on: [api]

volumes:
  pgdata:
