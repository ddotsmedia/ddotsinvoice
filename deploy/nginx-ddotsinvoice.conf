# Host nginx site config for DdotsInvoice (reference copy).
# NOT installed automatically: the VPS runs 30+ other sites behind the same nginx.
# Install manually: copy to /etc/nginx/sites-available/ddotsinvoice, symlink into sites-enabled,
# run `nginx -t`, then `systemctl reload nginx`. Do not touch other site files.

# Main site: web UI on 4300, API on 4301 under /api (API routes have no global prefix,
# so the /api segment is stripped before proxying).
server {
    server_name ddinvoice.com www.ddinvoice.com ddotsinvoice.com www.ddotsinvoice.com;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:4301/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ddinvoice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ddinvoice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# Super-admin console on 4302.
server {
    server_name admin.ddinvoice.com admin.ddotsinvoice.com;

    location / {
        proxy_pass http://127.0.0.1:4302;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ddinvoice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ddinvoice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
# TLS: after DNS points here, run `certbot --nginx -d ddotsinvoice.com -d www.ddotsinvoice.com -d admin.ddotsinvoice.com`
# (certbot edits only these server blocks).

server {
    if ($host = www.ddinvoice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ddinvoice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ddinvoice.com www.ddinvoice.com ddotsinvoice.com www.ddotsinvoice.com;
    return 404; # managed by Certbot




}
server {
    if ($host = admin.ddinvoice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.ddinvoice.com admin.ddotsinvoice.com;
    return 404; # managed by Certbot


}