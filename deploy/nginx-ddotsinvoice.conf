# Host nginx site config for DdotsInvoice (reference copy).
# NOT installed automatically: the VPS runs 30+ other sites behind the same nginx.
# Install manually: copy to /etc/nginx/sites-available/ddotsinvoice, symlink into sites-enabled,
# run `nginx -t`, then `systemctl reload nginx`. Do not touch other site files.

# Main site: web UI on 4100, API on 4101 under /api (API routes have no global prefix,
# so the /api segment is stripped before proxying).
server {
    listen 80;
    server_name ddotsinvoice.com www.ddotsinvoice.com;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:4101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Super-admin console on 4200.
server {
    listen 80;
    server_name admin.ddotsinvoice.com;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# TLS: after DNS points here, run `certbot --nginx -d ddotsinvoice.com -d www.ddotsinvoice.com -d admin.ddotsinvoice.com`
# (certbot edits only these server blocks).
